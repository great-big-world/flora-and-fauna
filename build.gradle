repositories {
    maven {
        url = uri "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/flora_and_fauna.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    modCompileOnly "maven.modrinth:sodium:mc1.21.5-0.6.13-fabric"
    modCompileOnly "maven.modrinth:visuality:0.7.10+1.21.5"
    modCompileOnly "maven.modrinth:particle-rain:3.3.4"
    common(project(path: ':core', configuration: 'namedElements')) { transitive false }
}